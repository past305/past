<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>past | Gateway</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <script>
        tailwind.config = { theme: { extend: { colors: { brandBlue: '#3b82f6', bgDark: '#03060a' } } } }
    </script>
</head>
<body class="flex flex-col items-center justify-center min-h-screen relative bg-bgDark">
    
    <canvas id="geometry-canvas" class="absolute inset-0 z-0"></canvas>

    <div class="z-10 w-full max-w-sm px-4">
        
        <div class="text-center mb-8">
            <h1 class="text-4xl font-bold tracking-[0.2em] text-brandBlue drop-shadow-[0_0_20px_rgba(59,130,246,0.6)] uppercase ml-2">past</h1>
            <p class="text-[10px] font-mono text-gray-500 tracking-[0.3em] uppercase mt-2"> </p>
        </div>

        <div class="glass-ring">
            <div id="login-card" class="glass-card transition-all duration-300 relative overflow-hidden group">
                
                <div class="inline-flex items-center justify-center w-14 h-14 bg-black/40 border border-brandBlue/20 rounded-xl mb-6 shadow-[0_0_15px_rgba(59,130,246,0.15)]">
                    <i class="fa-solid fa-satellite-dish animate-pulse text-xl text-brandBlue"></i>
                </div>
                
                <h1 class="text-xl font-bold mb-1 tracking-wide text-gray-100"></h1>
                <p class="text-gray-500 text-xs mb-8 font-mono"> </p>

                <form onsubmit="login(event)">
                    <div class="mb-5">
                        <label class="block text-[10px] font-semibold text-gray-400 uppercase tracking-wider mb-2 flex justify-between">
                            <span>Root Key</span>
                            <i class="fa-solid fa-lock text-gray-500"></i>
                        </label>
                        <div class="relative">
                            <i class="fa-solid fa-key absolute left-4 top-1/2 -translate-y-1/2 text-gray-500"></i>
                            <input type="password" id="token-input" placeholder="Enter token" class="w-full bg-black/50 border border-white/5 rounded-xl py-3 pl-11 pr-4 text-sm text-white focus:outline-none focus:border-brandBlue/50 transition-colors font-mono" autocomplete="off">
                        </div>
                    </div>

                    <div class="mb-8">
                        <div class="flex justify-between items-end mb-2">
                            <label class="block text-[10px] font-semibold text-gray-400 uppercase tracking-wider">Dynamic Passcode</label>
                            <span class="text-[10px] font-mono text-brandBlue bg-brandBlue/10 px-2 py-0.5 rounded border border-brandBlue/20" id="timer-text">25s</span>
                        </div>
                        
                        <div class="bg-black/50 border border-white/5 rounded-xl p-4 mb-3 relative overflow-hidden group shadow-inner">
                            <div class="flex items-center justify-between relative z-10">
                                <span id="generated-code" class="text-xl font-mono tracking-[0.25em] text-gray-200">-----</span>
                                <button type="button" onclick="generateCode()" class="text-gray-500 hover:text-white transition-colors"><i class="fa-solid fa-rotate text-sm"></i></button>
                            </div>
                            <div class="absolute bottom-0 left-0 w-full h-[2px] bg-white/5 z-10">
                                <div id="timer-bar" class="h-full bg-brandBlue transition-all duration-1000 shadow-[0_0_10px_#4d72f5]"></div>
                            </div>
                        </div>

                        <div class="relative">
                            <i class="fa-solid fa-terminal absolute left-4 top-1/2 -translate-y-1/2 text-gray-500"></i>
                            <input type="text" id="code-input" placeholder="Enter The Passcode" maxlength="5" class="w-full bg-black/50 border border-white/5 rounded-xl py-3 pl-11 pr-4 text-sm font-mono text-white focus:outline-none focus:border-brandBlue/50 transition-colors tracking-widest text-center" autocomplete="off">
                        </div>
                        
                        <p id="error-msg" class="text-[10px] font-mono text-red-400 mt-3 hidden text-center flex items-center gap-2 bg-red-500/10 p-2 rounded border border-red-500/20">
                            <i class="fa-solid fa-triangle-exclamation"></i> Wrong </p>
                    </div>

                    <button type="submit" class="w-full bg-brandBlue hover:bg-blue-600 text-white font-mono font-bold tracking-widest text-sm py-4 rounded-xl transition-all duration-200 active:scale-[0.98] uppercase shadow-[0_0_20px_rgba(59,130,246,0.3)]">
                        Login
                    </button>
                </form>
            </div>
        </div>
    </div>

    <footer class="absolute bottom-6 left-1/2 -translate-x-1/2 text-[10px] font-mono font-medium text-gray-500 tracking-widest uppercase z-10">
        Coded By : past - 305
    </footer>

    <script src="app.js"></script>
    <script>
        // كود تحريك الخلفية الهندسية
        const canvas = document.getElementById('geometry-canvas');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        const nodes = [];
        for (let i = 0; i < 50; i++) {
            nodes.push({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.width, // استخدام نفس البعد للبداية العشوائية
                dx: (Math.random() - 0.5) * 1.5,
                dy: (Math.random() - 0.5) * 1.5
            });
        }

        function drawNodes() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = 'rgba(59, 130, 246, 0.2)'; // لون البلو النودز
            ctx.strokeStyle = 'rgba(59, 130, 246, 0.1)'; // لون التشابك

            nodes.forEach(node => {
                ctx.beginPath();
                ctx.arc(node.x, node.y, 2, 0, Math.PI * 2);
                ctx.fill();

                node.x += node.dx;
                node.y += node.dy;

                // الارتداد عن الحدود
                if (node.x < 0 || node.x > canvas.width) node.dx *= -1;
                if (node.y < 0 || node.y > canvas.height) node.dy *= -1;

                nodes.forEach(otherNode => {
                    const dist = Math.sqrt((node.x - otherNode.x) ** 2 + (node.y - otherNode.y) ** 2);
                    if (dist < 150) { // مسافة التشابك
                        ctx.beginPath();
                        ctx.moveTo(node.x, node.y);
                        ctx.lineTo(otherNode.x, otherNode.y);
                        ctx.stroke();
                    }
                });
            });

            requestAnimationFrame(drawNodes);
        }

        drawNodes();
    </script>
</body>
</html>
